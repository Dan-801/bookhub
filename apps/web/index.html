<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAYVILE — Biblioteca de jogos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo">
    <div class="topo__conteudo">
      <div class="marca">
        <span class="marca__icone" aria-hidden="true"></span>
        <h1 class="marca__nome">STAYVILE</h1>
      </div>
      <span id="contador" class="contador"></span>
    </div>
  </header>

  <div class="layout">
    <aside class="lateral" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro" class="lateral__titulo">Cadastrar jogo</h2>

      <form id="form-jogo" class="formulario" novalidate>
        <div class="campo">
          <label for="nome">Nome do jogo</label>
          <input type="text" id="nome" name="nome" placeholder="Ex.: Hollow Knight" required>
        </div>

        <div class="campo">
          <label for="genero">Gênero</label>
          <input type="text" id="genero" name="genero" placeholder="Ex.: Aventura" required>
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade disponível</label>
          <input type="number" id="quantidade" name="quantidade" min="1" step="1" placeholder="Ex.: 3" required>
        </div>

        <div class="campo">
          <label for="valor">Valor do aluguel (R$)</label>
          <input type="number" id="valor" name="valor" min="0.01" step="0.01" placeholder="Ex.: 9,90" required>
        </div>

        <div class="campo">
          <label for="capa">Link da capa (URL)</label>
          <input type="url" id="capa" name="capa" placeholder="https://..." required>
        </div>

        <p id="mensagem-erro" class="mensagem-erro" role="alert"></p>

        <button type="submit" class="botao botao--primario">Cadastrar</button>
      </form>
    </aside>

    <main class="vitrine" aria-labelledby="titulo-acervo">
      <div class="vitrine__topo">
        <h2 id="titulo-acervo">Acervo</h2>
        <p class="aviso">Visão de um usuário (ainda sem login): "Emprestado por você" aparece só para quem está com o jogo.</p>
      </div>

      <ul id="lista-jogos" class="lista-jogos"></ul>
      <p id="lista-vazia" class="lista-vazia" hidden>Nenhum jogo cadastrado ainda.</p>
    </main>
  </div>

  <footer class="rodape">
    <p>STAYVILE · projeto do curso DevHub (BookHub)</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
